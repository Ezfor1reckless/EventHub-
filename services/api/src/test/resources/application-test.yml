# 测试专用的覆盖项。
#
# 文件名是 application-test.yml 而不是 application.yml，这一点很关键：
# Spring Boot 对 `classpath:/application.yml` 只加载**第一个**匹配到的文件，
# 而 target/test-classes 在 classpath 里排在 target/classes 之前。
# 所以一份 src/test/resources/application.yml 会**整体遮蔽**主配置——不是叠加，是替换。
#
# 那个坑的后果很隐蔽：ddl-auto=validate、flyway 位置、JWT 默认值这些主配置
# 在测试里统统没有生效，而且不会有任何提示。schema 校验实际上从未在集成测试里跑过，
# 一旦实体与迁移脚本漂移，测试是发现不了的。
#
# 改成 profile 专属文件后：主配置照常加载，这里的键覆盖同名的那些。
# 由 AbstractIntegrationTest 上的 @ActiveProfiles("test") 激活。
#
# 数据源 / Redis / RabbitMQ 仍由 Testcontainers 通过 @ServiceConnection 注入。
spring:
  mail:
    # 故意指向一个解析不了的主机。
    #
    # 这不是笔误。Spring Boot 只要发现 spring.mail.host 有值就会注册
    # MailHealthIndicator，它会真的去连 SMTP；连不上就把 /actuator/health 判成 DOWN。
    # 而部署编排依赖这个接口判断实例是否可用——健康检查一旦为 DOWN，
    # 容器会被标记 unhealthy，依赖它的 Nginx 直接拒绝启动。
    #
    # 这里放一个必然失败的主机，就是为了让 HealthEndpointIT 真正验证
    # 「邮件这种可选依赖不会拖垮整个应用的健康状态」。
    # 不这么设的话，应用根本没注册这个指标，测试会无条件通过，等于什么都没测。
    host: smtp.invalid

app:
  jwt:
    # 仅仅是测试密钥，长度需 ≥32 字节以满足 HS256 的下限
    secret: integration-test-only-secret-key-please-do-not-use-in-production
  rate-limit:
    # 所有集成测试都从 127.0.0.1 发起，而测试会创建几十个用户，
    # 任何有意义的人均限流都会把测试本身挡住。限流逻辑由 RateLimitServiceIT
    # 用小限额单独验证。
    enabled: false
  outbox:
    # 把投递间隔拉到 1 小时：@Scheduled 只在启动时跑一次，之后整个测试期间不再触发。
    # 测试改为显式调用 publishPending()，这样「事件仍是 PENDING」这类断言
    # 不会和一个每 2 秒跑一次的调度器抢时序。
    publish-interval: 1h


