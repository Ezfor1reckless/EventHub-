spring:
  application:
    name: eventhub-api

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:eventhub}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:eventhub}
    password: ${MYSQL_PASSWORD:}

  jpa:
    # 结构由 Flyway 掌管。validate 让实体与迁移脚本的漂移在启动时就暴露，
    # 而不是等到某次查询运行到一半才炸。
    hibernate:
      ddl-auto: validate
    # 关掉 Open Session in View：否则视图渲染期间还握着数据库连接，
    # 会把连接池耗尽的问题掩盖到生产环境才发作。
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventhub}
    password: ${RABBITMQ_PASSWORD:}
    # 生产者确认：消息真正落到 broker 才算发送成功
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 用自动 ACK + 重试拦截器，而不是手动 ACK。
        #
        # 手动 ACK 下，监听器抛异常后要么无限 requeue（热循环打满 CPU），
        # 要么直接 nack 进死信队列——一次数据库瞬断就会把「活动取消」这类通知
        # 直接扔进 DLQ，用户永远收不到，得人工重放。
        # 自动 ACK 配合下面的重试策略，瞬断能自愈，只有真正处理不了的才进 DLQ。
        acknowledge-mode: auto
        prefetch: 10
        # 重试用尽后拒绝消息并丢弃，由队列的 dead-letter-exchange 送进死信队列。
        # 若设为 true 会无限 requeue，等于放弃死信队列。
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # 故意不给默认值：密钥缺失时启动即失败，好过用一个人人皆知的默认值跑起来
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    issuer: eventhub
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  security:
    # 只有确实部署在可信反向代理（Nginx）之后才设为 true。
    # 置为 true 后才会采信 X-Forwarded-For——而那个头是可被客户端伪造的，
    # 无条件采信会让基于 IP 的限流形同虚设。
    trust-proxy: ${TRUST_PROXY:false}
  rate-limit:
    # 关掉后所有限流检查直接放行。
    # 集成测试与端到端测试都必须关：它们全部从同一个 IP（127.0.0.1）发起，
    # 而测试会创建几十个用户，任何有意义的人均限流都会把测试自己挡住。
    # 限流逻辑本身由 RateLimitServiceIT 用小限额单独验证。
    enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:eh_refresh}
      # 收窄到认证路径：刷新令牌没有理由出现在每一次业务请求里
      path: ${AUTH_COOKIE_PATH:/api/v1/auth}
      # 生产必须 true（只有 HTTPS 才下发）。本地 http 开发为 false。
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  mail:
    # false 时邮件只记日志，不真的发送——开发环境不需要一个可用的 SMTP 也能跑通通知链路。
    # 置 true 并配好 spring.mail.* 即切换到真实发送。
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:noreply@example.com}
  outbox:
    # 集成测试里若要断言「事件仍是 PENDING」，可关掉投递器
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:2s}
    cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:1h}
    retention: ${OUTBOX_RETENTION:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.eventhub.api: INFO
