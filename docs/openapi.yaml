openapi: 3.1.0
info:
  title: EventHub API
  description: 社区活动报名与签到平台后端接口。所有响应统一为 ApiResponse 结构。
  license:
    name: MIT
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: 认证
  description: 注册、登录、刷新、登出
paths:
  /api/v1/events/{id}:
    get:
      tags:
      - 活动
      summary: 活动详情
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
    put:
      tags:
      - 活动
      summary: 更新活动
      description: 全量替换。注意用的是 PUT 而不是 PATCH
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /api/v1/events:
    get:
      tags:
      - 活动
      summary: 活动列表
      description: 只返回已发布的活动，公开可访问
      operationId: list
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseEventResponse"
    post:
      tags:
      - 活动
      summary: 创建活动
      description: 创建后为草稿状态，需再调 publish 才会对外可见
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /api/v1/events/{id}/publish:
    post:
      tags:
      - 活动
      summary: 发布活动
      description: 只有草稿状态可以发布
      operationId: publish
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /api/v1/events/{id}/cancel:
    post:
      tags:
      - 活动
      summary: 取消活动
      description: 同时清空该活动的候补队列
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /api/v1/events/{eventId}/registrations:
    get:
      tags:
      - 报名
      summary: 活动的报名列表
      description: 仅活动组织者或管理员可见
      operationId: listByEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseRegistrationResponse"
    post:
      tags:
      - 报名
      summary: 报名活动
      description: 幂等：已报名时原样返回既有记录，不会重复占位。满员则自动进入候补。
      operationId: register
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRegistrationResponse"
  /api/v1/events/{eventId}/checkins/manual:
    post:
      tags:
      - 签到
      summary: 手工补签
      description: 组织者按票券码补签，用于扫码失败的兜底
      operationId: manualCheckIn
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCheckInRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckInResponse"
  /api/v1/events/{eventId}/checkin-session:
    post:
      tags:
      - 签到
      summary: 生成签到二维码
      description: 组织者调用。返回的 token 有效 60 秒，期间可被多人重复扫描。
      operationId: createSession
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckInSessionResponse"
  /api/v1/checkins/scan:
    post:
      tags:
      - 签到
      summary: 扫码签到
      description: 重复签到返回 409 ALREADY_CHECKED_IN
      operationId: scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckInResponse"
  /api/v1/auth/register:
    post:
      tags:
      - 认证
      summary: 注册
      description: 注册成功后直接签发令牌，无需再调登录
      operationId: register_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - 认证
      summary: 刷新令牌
      description: 轮换式刷新：旧 refreshToken 立即失效，返回新的一对
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - 认证
      summary: 登出
      description: 拉黑当前 access token 并吊销该用户全部 refresh token
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      summary: 登录
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/v1/me:
    get:
      tags:
      - 当前用户
      summary: 获取当前登录用户
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/v1/me/registrations:
    get:
      tags:
      - 报名
      summary: 我的报名
      operationId: myRegistrations
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseRegistrationResponse"
  /api/v1/me/events:
    get:
      tags:
      - 当前用户
      summary: 我组织的活动
      operationId: myEvents
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseEventResponse"
  /api/v1/events/{eventId}/checkins:
    get:
      tags:
      - 签到
      summary: 签到统计
      description: 仅活动组织者或管理员可见
      operationId: stats
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckInStatsResponse"
  /api/v1/registrations/{registrationId}:
    delete:
      tags:
      - 报名
      summary: 取消报名
      description: 名额会立即递补给候补队列的队首
      operationId: cancel_1
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    EventRequest:
      type: object
      description: 活动表单
      properties:
        title:
          type: string
          example: 周末羽毛球
          maxLength: 200
          minLength: 0
        description:
          type: string
          description: 活动详情，支持长文本
          maxLength: 5000
          minLength: 0
        coverUrl:
          type: string
          example: https://cdn.example.com/cover.png
          maxLength: 512
          minLength: 0
        location:
          type: string
          example: 朝阳区全民健身中心 3 号馆
          maxLength: 255
          minLength: 0
        startAt:
          type: string
          format: date-time
          description: ISO-8601 时间戳
          example: 2026-11-01T02:00:00Z
        endAt:
          type: string
          format: date-time
          example: 2026-11-01T04:00:00Z
        capacity:
          type: integer
          format: int32
          description: 报名人数上限
          example: 30
          maximum: 100000
          minimum: 1
      required:
      - endAt
      - startAt
    ApiResponseEventResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/EventResponse"
          description: 业务数据，失败时为 null
    EventResponse:
      type: object
      description: 活动信息
      properties:
        id:
          type: integer
          format: int64
        organizerId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        coverUrl:
          type: string
        location:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - FINISHED
        confirmedCount:
          type: integer
          format: int64
          description: 已确认名额数（含已签到）
        waitlistedCount:
          type: integer
          format: int64
          description: 候补人数
        seatsRemaining:
          type: integer
          format: int32
          description: 剩余名额，不会为负
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseRegistrationResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/RegistrationResponse"
          description: 业务数据，失败时为 null
    EventSummary:
      type: object
      description: 活动摘要
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        location:
          type: string
        coverUrl:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - FINISHED
    RegistrationResponse:
      type: object
      description: 报名信息
      properties:
        id:
          type: integer
          format: int64
        event:
          $ref: "#/components/schemas/EventSummary"
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - WAITLISTED
          - CANCELLED
          - CHECKED_IN
        ticketCode:
          type: string
          description: 电子票券编号
        waitlistedAt:
          type: string
          format: date-time
          description: 进入候补的时刻，非候补为 null
        registeredAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
    ManualCheckInRequest:
      type: object
      description: 手工补签请求
      properties:
        ticketCode:
          type: string
          description: 用户的电子票券编号
          minLength: 1
    ApiResponseCheckInResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/CheckInResponse"
          description: 业务数据，失败时为 null
    CheckInResponse:
      type: object
      description: 签到结果
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        registrationId:
          type: integer
          format: int64
        ticketCode:
          type: string
        checkedInAt:
          type: string
          format: date-time
        method:
          type: string
          enum:
          - QR_SCAN
          - MANUAL
    ApiResponseCheckInSessionResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/CheckInSessionResponse"
          description: 业务数据，失败时为 null
    CheckInSessionResponse:
      type: object
      description: 签到码会话
      properties:
        token:
          type: string
          description: 客户端据此渲染二维码
        expiresInSeconds:
          type: integer
          format: int64
          description: 有效期秒数
    ScanRequest:
      type: object
      description: 扫码签到请求
      properties:
        token:
          type: string
          description: 二维码里解出的签到码
          minLength: 1
    RegisterRequest:
      type: object
      description: 注册请求
      properties:
        email:
          type: string
          example: alice@example.com
          maxLength: 255
          minLength: 0
        password:
          type: string
          description: 至少 8 位，且需同时包含字母和数字
          example: s3cretPass
          maxLength: 72
          minLength: 8
          pattern: "^(?=.*[A-Za-z])(?=.*\\d).+$"
        nickname:
          type: string
          example: 爱丽丝
          maxLength: 64
          minLength: 0
        phone:
          type: string
          description: 可选，中国大陆手机号
          example: 13800138000
          pattern: "^$|^1[3-9]\\d{9}$"
    ApiResponseTokenResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/TokenResponse"
          description: 业务数据，失败时为 null
    TokenResponse:
      type: object
      description: 令牌响应
      properties:
        accessToken:
          type: string
          description: "访问令牌，放在 Authorization: Bearer <token>"
        refreshToken:
          type: string
          description: 刷新令牌，只在此刻返回一次明文；服务端仅存哈希
        tokenType:
          type: string
          description: 固定为 Bearer
        expiresIn:
          type: integer
          format: int64
          description: 访问令牌剩余有效秒数
    RefreshRequest:
      type: object
      description: 刷新令牌请求
      properties:
        refreshToken:
          type: string
          description: 登录时返回的 refreshToken
          minLength: 1
    ApiResponseVoid:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          type: object
          description: 业务数据，失败时为 null
    LoginRequest:
      type: object
      description: 登录请求
      properties:
        email:
          type: string
          example: alice@example.com
          minLength: 1
        password:
          type: string
          example: s3cretPass
          minLength: 1
    ApiResponseUserResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/UserResponse"
          description: 业务数据，失败时为 null
    UserResponse:
      type: object
      description: 用户信息
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - ORGANIZER
            - ADMIN
          uniqueItems: true
        status:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - DISABLED
        createdAt:
          type: string
          format: date-time
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    ApiResponsePageResponseRegistrationResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/PageResponseRegistrationResponse"
          description: 业务数据，失败时为 null
    PageResponseRegistrationResponse:
      type: object
      description: 分页结果
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
    ApiResponsePageResponseEventResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/PageResponseEventResponse"
          description: 业务数据，失败时为 null
    PageResponseEventResponse:
      type: object
      description: 分页结果
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
    ApiResponseCheckInStatsResponse:
      type: object
      description: 统一响应结构
      properties:
        success:
          type: boolean
          description: 是否成功
        code:
          type: string
          description: 业务码，成功固定为 OK
        message:
          type: string
          description: 人类可读的提示
        data:
          $ref: "#/components/schemas/CheckInStatsResponse"
          description: 业务数据，失败时为 null
    CheckInStatsResponse:
      type: object
      description: 活动签到统计
      properties:
        eventId:
          type: integer
          format: int64
        confirmedCount:
          type: integer
          format: int64
          description: 已确认名额数（含已签到）
        checkedInCount:
          type: integer
          format: int64
          description: 已签到人数
        waitlistedCount:
          type: integer
          format: int64
          description: 候补人数
        checkInRate:
          type: number
          format: double
          description: 签到率 = 已签到 / 已确认，已确认 0 时为 0
  securitySchemes:
    bearerAuth:
      type: http
      description: 填入 /api/v1/auth/login 返回的 accessToken
      scheme: bearer
      bearerFormat: JWT
